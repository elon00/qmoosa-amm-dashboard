name: Dashboard Reality & Browser E2E Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies with strict lockfile
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Unit Tests (Decimal & Stale-Quote Invariants)
        run: npm run test:unit

      - name: Run Playwright Browser E2E Tests
        run: npm run test:e2e

      - name: Run Vite production asset build verification
        run: npm run build

      - name: Run Static Type Verification (tsc)
        run: npm run typecheck

      - name: Run Code Linting Gate (ESLint)
        run: npm run lint
